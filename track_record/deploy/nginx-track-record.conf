# Static hosting for the track-record dashboard.
# Install: /etc/nginx/sites-available/track-record  → symlink into sites-enabled.
#
#   ln -s /etc/nginx/sites-available/track-record /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d track.example.com      # HTTPS (recommended)
#
# The web/ assets (index.html, app.js, styles.css) are copied into the root below;
# the exporter writes track_record.json into the same dir every 10 min.

server {
    listen 80;
    server_name track.example.com;          # ← set your domain/subdomain

    root /var/www/track-record;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never cache the data file, so visitors always see the latest record.
    location = /track_record.json {
        add_header Cache-Control "no-store, must-revalidate";
        types { } default_type application/json;
    }

    # Static assets can cache briefly.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300";
    }
}
