# Risk Management Limits — Sentinel Architecture

daily_loss_limit_pct: 0.05       # 5% max daily loss before circuit breaker
max_leverage: 8                  # Maximum leverage allowed
max_open_positions: 3            # Total positions across all symbols
max_symbol_concentration: 0.5    # 50% max exposure per symbol

# Confidence-based risk tiers
low_confidence_risk_pct: 0.01    # 1% risk per trade when confidence < 0.4
default_risk_per_trade_pct: 0.03 # 3% risk per trade (standard)
high_confidence_risk_pct: 0.07   # 7% risk per trade when confidence > 0.7

# Protective measures
trailing_stop_activation_pct: 1.0 # Start trailing after 1% profit
kill_switch_enabled: true
circuit_breaker_enabled: true
paper_mode: true                 # ALWAYS default to true
