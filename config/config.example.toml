# CryptoSentinelTrader Configuration
# Copy this file to config.toml and fill in your API keys

[exchange]
primary = "binance_futures_testnet"
api_key = "YOUR_TESTNET_API_KEY"
api_secret = "YOUR_TESTNET_API_SECRET"
symbols = ["BTCUSDT", "ETHUSDT"]

[risk]
default_risk_per_trade = 0.03        # 3% per trade (medium confidence)
low_confidence_risk = 0.01           # 1% when confidence < 0.4
high_confidence_risk = 0.05          # 5-7% when confidence > 0.7
max_leverage = 8
max_open_positions = 3
daily_loss_limit_pct = 0.10          # Stop trading after 10% daily loss

[ai_engine]
primary_llm = "gemini-2.5-flash"
fallback_llm = "claude-sonnet"
llm_call_interval_sec = 60
anomaly_trigger_llm = true
max_daily_llm_cost_usd = 5.0
math_weight = 0.6                    # 60% weight to pure math engine
llm_weight = 0.4                     # 40% weight to LLM analysis

[signals]
snapshot_interval_sec = 10
indicators = ["rsi_14", "macd", "bb_20", "ema_9", "ema_21", "ema_50", "atr_14", "vwap"]
volume_spike_threshold = 2.0
anomaly_score_threshold = 0.7

[pipeline]
zmq_address = "tcp://127.0.0.1:5555"
snapshot_file = "/tmp/sentinel_snapshot.json"

[paper]
starting_balance = 1000.0
