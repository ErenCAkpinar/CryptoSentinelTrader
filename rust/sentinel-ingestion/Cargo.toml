[package]
name = "sentinel-ingestion"
version = "0.1.0"
edition = "2021"
authors = ["Eren C. Akpinar"]
description = "High-performance market data ingestion and signal processing engine"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ta = "0.5"                          # Technical analysis indicators
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
futures-util = "0.3"
url = "2"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", features = ["json"] }

# IPC with Python layer
zmq = "0.10"                        # ZeroMQ for Rust→Python communication

# Performance
dashmap = "5"                       # Concurrent hashmap
parking_lot = "0.12"                # Faster mutexes

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
